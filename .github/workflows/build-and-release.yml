name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build Typedown Editor
        working-directory: Dev/Typedown.Editor
        run: yarn install && yarn build
        env:
          CI: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            6.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild Typedown.sln -t:Restore -p:Configuration=Release -p:Platform=x64

      - name: Build Solution
        run: msbuild Typedown.sln -p:Configuration=Release -p:Platform=x64 -p:AppxPackageSigningEnabled=false

      - name: Create MSIX Package
        run: msbuild Tools\Typedown.Package\Typedown.Package.wapproj -p:Configuration=Release -p:Platform=x64 -p:UapAppxPackageBuildMode=StoreUpload -p:AppxBundle=Never -p:AppxPackageSigningEnabled=false

      - name: Find MSIX file
        id: find-msix
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Filter "*.msix" -Recurse | Select-Object -First 1
          if ($msix) {
            echo "msix_path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
            echo "msix_name=$($msix.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No MSIX file found"
            exit 1
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Typedown-MSIX
          path: ${{ steps.find-msix.outputs.msix_path }}
          retention-days: 5

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-msix.outputs.msix_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
