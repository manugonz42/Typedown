name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build Typedown Editor
        working-directory: Dev/Typedown.Editor
        run: yarn install && yarn build
        env:
          CI: false

      - name: Setup .NET Core 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore with dotnet (using 3.1 SDK)
        shell: pwsh
        run: |
          $env:DOTNET_ROLL_FORWARD="LatestPatch"
          dotnet restore Typedown.sln -p:Configuration=Release -p:Platform=x64

      - name: Build Solution
        run: msbuild Typedown.sln -p:Configuration=Release -p:Platform=x64 -p:AppxPackageSigningEnabled=false -restore:false

      - name: Create MSIX Package
        run: msbuild Tools\Typedown.Package\Typedown.Package.wapproj -p:Configuration=Release -p:Platform=x64 -p:UapAppxPackageBuildMode=StoreUpload -p:AppxBundle=Never -p:AppxPackageSigningEnabled=false -restore:false

      - name: Find MSIX file
        id: find-msix
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Filter "*.msix" -Recurse | Select-Object -First 1
          if ($msix) {
            echo "msix_path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
            echo "msix_name=$($msix.Name)" >> $env:GITHUB_OUTPUT
            Write-Host "Found MSIX: $($msix.FullName)"
          } else {
            Write-Host "No MSIX file found, looking for MSIXBundle..."
            $bundle = Get-ChildItem -Path . -Filter "*.msixbundle" -Recurse | Select-Object -First 1
            if ($bundle) {
              echo "msix_path=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
              echo "msix_name=$($bundle.Name)" >> $env:GITHUB_OUTPUT
              Write-Host "Found MSIXBundle: $($bundle.FullName)"
            } else {
              Write-Host "Searching all package outputs..."
              Get-ChildItem -Path .\Tools\Typedown.Package -Recurse -Include *.msix,*.msixbundle,*.appx,*.appxbundle 2>$null | ForEach-Object { Write-Host $_.FullName }
              Get-ChildItem -Path .\AppPackages -Recurse -Include *.msix,*.msixbundle 2>$null | ForEach-Object { Write-Host $_.FullName }
              exit 1
            }
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Typedown-MSIX
          path: ${{ steps.find-msix.outputs.msix_path }}
          retention-days: 5

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-msix.outputs.msix_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
